name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run cron job every month, https://crontab.guru/every-month
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  test-cc-and-jb-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Pytest tests
        run: |
          pytest

      - name: Generate module from the cookiecutter
        run: |
          cookiecutter . --no-input --overwrite-if-exists

      - name: Install requirements of the generated module
        run: |
          pip install -r book/requirements.txt

      - name: Build the example book (treat warnings as errors)
        run: |
          jupyter-book build -W --keep-going book/book/
